[project]
name = "tunelo"
version = "4.0.0"
description = "Chameleon on-demand tunnel provisioning service"
authors = [{ name = "Chameleon", email = "contact@chameleoncloud.org" }]
requires-python = ">=3.8.2,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]
dependencies = [
    "Flask",
    "importlib-metadata",
    "oslo.config",
    "oslo.log",
    "osprofiler",
    "oslo.service",
    "oslo.messaging",
    "oslo.middleware",
    "keystonemiddleware",
    "oslo.policy",
    "oslo.reports",
    "futurist",
    "oslo.rootwrap",
    "python-neutronclient",
    "jsonschema",
]

[project.scripts]
tunelo-api = "tunelo.cmd.api:main"
tunelo-rootwrap = "oslo_rootwrap.cmd:main"

[project.entry-points."oslo.config.opts"]
tunelo = "tunelo.conf.opts:list_opts"

[project.entry-points."oslo.config.opts.defaults"]
tunelo = "tunelo.conf.opts:update_opt_defaults"

[project.entry-points."oslo.policy.enforcer"]
tunelo = "tunelo.common.policy:get_oslo_policy_enforcer"

[project.entry-points."oslo.policy.policies"]
"tunelo.api" = "tunelo.common.policy:list_policies"

[dependency-groups]
dev = [
    "oslotest",
    "ruff",
    "stestr",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tunelo*"]
exclude = ["tunelo.tests*"]

[tool.setuptools.package-data]
tunelo = ["etc/tunelo/*"]
