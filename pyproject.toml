[project]
name = "tunelo"
version = "7.0.0"
description = "Chameleon on-demand tunnel provisioning service"
authors = [{ name = "Chameleon", email = "contact@chameleoncloud.org" }]
requires-python = ">=3.9"
dependencies = [
    "Flask",
    "jsonschema",
    "keystonemiddleware",
    "oslo.config",
    "oslo.log",
    "oslo.middleware",
    "oslo.policy",
    "oslo.reports",
    "oslo.rootwrap",
    "oslo.service",
    "osprofiler",
    "python-neutronclient",
]

[project.scripts]
tunelo-api = "tunelo.cmd.api:main"
tunelo-rootwrap = "oslo_rootwrap.cmd:main"

[project.entry-points."oslo.config.opts"]
tunelo = "tunelo.conf.opts:list_opts"

[project.entry-points."oslo.config.opts.defaults"]
tunelo = "tunelo.conf.opts:update_opt_defaults"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tunelo*"]
exclude = ["tunelo.tests*"]

[tool.setuptools.data-files]
"etc/tunelo" = [
    "etc/tunelo/rootwrap.conf",
]
"etc/tunelo/rootwrap.d" = [
    "etc/tunelo/rootwrap.d/*",
]
